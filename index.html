<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="푸릇" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>🌱 푸릇 · Pureut</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    :root {
      /* ── Bright botanical palette ── */
      --bg: #FAF8F2;
      --bg-tint: #F4EFE4;
      --surface: #FFFFFF;
      --surface-2: #F6F3EC;
      --surface-3: #EDE8DC;
      --border: #E5DFD0;
      --border-soft: #EFEAE0;

      --green: #5C9663;
      --green-deep: #3F7448;
      --green-soft: rgba(92, 150, 99, 0.10);
      --green-tint: #E8F0E5;

      --terra: #C8794A;
      --terra-soft: rgba(200, 121, 74, 0.12);

      --orange: #D89343;
      --orange-soft: rgba(216, 147, 67, 0.12);

      --red: #D05656;
      --red-soft: rgba(208, 86, 86, 0.10);

      --blue: #4A89BB;
      --blue-soft: rgba(74, 137, 187, 0.12);

      --text: #2A2723;
      --text-mid: #595650;
      --text-dim: #8A8579;
      --text-faint: #B8B3A4;

      --shadow-sm: 0 1px 3px rgba(80, 60, 30, 0.06), 0 1px 2px rgba(80, 60, 30, 0.04);
      --shadow: 0 4px 16px rgba(80, 60, 30, 0.08), 0 1px 4px rgba(80, 60, 30, 0.04);
      --shadow-lg: 0 12px 32px rgba(80, 60, 30, 0.12), 0 2px 6px rgba(80, 60, 30, 0.06);

      --radius: 16px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top, 0);
      --safe-bottom: env(safe-area-inset-bottom, 0);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
    }
    body {
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 80px);
      max-width: 720px;
      margin: 0 auto;
      background:
        radial-gradient(circle at 0% 0%, rgba(92, 150, 99, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(200, 121, 74, 0.04) 0%, transparent 40%),
        var(--bg);
      background-attachment: fixed;
    }
    button {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }
    input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      width: 100%;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-soft);
    }
    textarea { resize: vertical; min-height: 70px; }

    /* ─── HEADER ─── */
    .app-header {
      padding: 22px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }
    .brand {
      display: flex; flex-direction: column; gap: 2px;
    }
    .brand-row {
      display: flex; align-items: center; gap: 10px;
    }
    .brand-logo {
      font-size: 28px;
      filter: drop-shadow(0 2px 4px rgba(92, 150, 99, 0.25));
    }
    .brand-title {
      font-size: 24px; font-weight: 700; letter-spacing: -0.02em;
      color: var(--text);
    }
    .brand-sub {
      font-size: 12px; color: var(--text-dim); letter-spacing: 0.04em;
      margin-left: 38px;
    }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      font-size: 16px;
      color: var(--text-mid);
      box-shadow: var(--shadow-sm);
      transition: transform .12s, box-shadow .12s;
    }
    .icon-btn:active { transform: translateY(1px); box-shadow: none; }

    /* ─── STATS BAR ─── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 20px 18px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-num {
      font-size: 24px; font-weight: 700; line-height: 1;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .stat-num.water { color: var(--blue); }
    .stat-num.overdue { color: var(--red); }
    .stat-label {
      font-size: 11px; color: var(--text-dim);
      margin-top: 6px; letter-spacing: 0.04em;
      font-weight: 500;
    }

    /* ─── SECTION ─── */
    .section {
      padding: 8px 20px 20px;
    }
    .section-title {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-title h2 {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-mid);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .section-title .count {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      font-weight: 600;
    }

    /* ─── TODAY TASKS ─── */
    .today-list { display: flex; flex-direction: column; gap: 10px; }
    .today-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-left: 4px solid var(--blue);
      border-radius: var(--radius);
      padding: 14px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: var(--shadow-sm);
    }
    .today-card.overdue { border-left-color: var(--red); background: linear-gradient(90deg, rgba(208,86,86,0.04), var(--surface) 30%); }
    .today-thumb {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--green-tint);
      object-fit: cover;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .today-info { flex: 1; min-width: 0; }
    .today-name {
      font-weight: 600; font-size: 15px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text);
    }
    .today-meta {
      font-size: 12px; color: var(--text-dim);
      margin-top: 2px;
      font-weight: 500;
    }
    .today-action {
      background: var(--green);
      color: white;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(63, 116, 72, 0.25);
      transition: transform .1s, box-shadow .1s;
    }
    .today-action:active { transform: scale(.95); box-shadow: 0 1px 3px rgba(63,116,72,0.2); }
    .today-dismiss {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--surface-3);
      color: var(--text-faint);
      font-size: 14px;
      flex-shrink: 0;
      transition: background .12s, color .12s;
    }
    .today-dismiss:active { background: var(--red-soft); color: var(--red); }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-dim);
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }
    .empty-state .ico { font-size: 36px; margin-bottom: 8px; opacity: 0.6; }
    .empty-state .msg { font-size: 13px; }

    /* ─── PLANT GRID ─── */
    .plant-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .plant-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform .15s, box-shadow .15s;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .plant-card:active { transform: scale(.98); box-shadow: none; }
    .plant-photo {
      width: 100%;
      aspect-ratio: 1;
      background: var(--green-tint);
      object-fit: cover;
      display: block;
    }
    .plant-photo-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #E8F0E5 0%, #D5E2D0 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 52px; opacity: 0.7;
    }
    .plant-info { padding: 12px; }
    .plant-name {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text);
    }
    .plant-nickname {
      font-size: 11px; font-weight: 500;
      color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }
    .plant-badge {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      display: flex; align-items: center; gap: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .plant-badge.fresh { color: var(--green-deep); }
    .plant-badge.due { color: var(--blue); }
    .plant-badge.overdue { color: var(--red); }
    .health-dot {
      position: absolute;
      top: 10px; right: 10px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 2px white, 0 1px 3px rgba(0,0,0,0.15);
    }
    .health-dot.caution { background: var(--orange); }
    .health-dot.sick { background: var(--red); }

    /* ─── FAB ─── */
    .fab {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 24px);
      right: 24px;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
      color: white;
      font-size: 30px;
      font-weight: 300;
      box-shadow: 0 8px 24px rgba(63, 116, 72, 0.35), 0 2px 6px rgba(63,116,72,0.2);
      display: flex; align-items: center; justify-content: center;
      z-index: 50;
      transition: transform .15s;
    }
    .fab:active { transform: scale(.92); }
    @media (min-width: 720px) {
      .fab { right: calc(50% - 360px + 24px); }
    }

    /* ─── MODAL ─── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(40, 30, 20, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn .2s;
    }
    .modal-backdrop.active { display: flex; }
    @media (min-width: 720px) { .modal-backdrop { align-items: center; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(40px); } to { transform: translateY(0); } }

    .modal {
      background: var(--bg);
      width: 100%;
      max-width: 720px;
      max-height: 92vh;
      border-radius: 24px 24px 0 0;
      overflow-y: auto;
      animation: slideUp .25s cubic-bezier(.2,.7,.3,1);
      padding-bottom: var(--safe-bottom);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.15);
    }
    @media (min-width: 720px) {
      .modal { border-radius: 24px; max-height: 88vh; }
    }
    .modal-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 10px auto 0;
    }
    .modal-header {
      padding: 16px 20px 14px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-soft);
      position: sticky; top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .modal-title { font-size: 17px; font-weight: 700; color: var(--text); }
    .modal-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim);
      font-size: 22px;
      border-radius: 8px;
    }
    .modal-close:active { background: var(--surface-3); }
    .modal-body { padding: 20px; }

    /* ─── FORM ─── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 7px;
      letter-spacing: 0.03em;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .radio-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .radio-pill {
      display: block;
      text-align: center;
      padding: 11px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-mid);
      transition: all .15s;
    }
    .radio-pill input { display: none; }
    .radio-pill.active {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green-deep);
      font-weight: 600;
    }
    /* ─── TOGGLE ROW (optional features) ─── */
    .toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }
    .toggle-row .label-text {
      font-size: 14px; font-weight: 500; color: var(--text);
    }
    .toggle-row .label-hint {
      font-size: 11px; color: var(--text-dim); margin-top: 2px;
    }
    .toggle-pill {
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      transition: all .15s;
      flex-shrink: 0;
    }
    .toggle-pill[data-on="true"] {
      background: var(--green);
      color: white;
      border-color: var(--green);
      box-shadow: 0 2px 6px rgba(63,116,72,0.25);
    }
    .photo-upload {
      width: 100%;
      aspect-ratio: 16/10;
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
      color: var(--text-dim);
      font-size: 13px;
      background: var(--surface);
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: border-color .15s, background .15s;
    }
    .photo-upload:hover { border-color: var(--green); background: var(--green-soft); }
    .photo-upload .ico { font-size: 30px; }
    .photo-upload img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .photo-upload input[type=file] { display: none; }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      transition: transform .12s, box-shadow .12s;
      border: 1px solid transparent;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--green), var(--green-deep));
      color: white;
      box-shadow: 0 2px 8px rgba(63, 116, 72, 0.3);
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-danger {
      background: var(--red-soft);
      color: var(--red);
      border-color: rgba(208, 86, 86, 0.25);
    }
    .btn:disabled { opacity: 0.5; pointer-events: none; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* ─── PLANT DETAIL ─── */
    .detail-hero {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--green-tint);
      object-fit: cover;
    }
    .detail-hero-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #E8F0E5 0%, #C5D8C0 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 64px; opacity: 0.6;
    }
    .detail-content { padding: 16px 20px 0; }
    .detail-title {
      font-size: 24px; font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      color: var(--text);
    }
    .detail-sub {
      font-size: 13px; color: var(--text-dim);
      margin-bottom: 12px;
      font-weight: 500;
    }
    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .quick-btn {
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      box-shadow: var(--shadow-sm);
      color: var(--text-mid);
    }
    .quick-btn .ico { font-size: 22px; }
    .quick-btn.water {
      color: var(--blue);
      background: var(--blue-soft);
      border-color: rgba(74,137,187,0.2);
    }
    .quick-btn.fert {
      color: var(--terra);
      background: var(--terra-soft);
      border-color: rgba(200,121,74,0.2);
    }

    .info-grid {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 4px 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-sm);
    }
    .info-row {
      display: flex; justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-soft);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-key { color: var(--text-dim); font-size: 13px; font-weight: 500; }
    .info-val { font-weight: 600; text-align: right; color: var(--text); }

    .timeline {
      display: flex; flex-direction: column; gap: 10px;
    }
    .timeline-item {
      display: flex; gap: 12px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 12px;
      border: 1px solid var(--border-soft);
    }
    .timeline-photo {
      width: 64px; height: 64px;
      border-radius: 10px;
      background: var(--green-tint);
      object-fit: cover;
      flex-shrink: 0;
    }
    .timeline-photo-empty {
      width: 64px; height: 64px;
      border-radius: 10px;
      background: var(--green-tint);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; opacity: .5;
      flex-shrink: 0;
    }
    .timeline-body { flex: 1; min-width: 0; }
    .timeline-date {
      font-size: 12px; color: var(--text-dim);
      margin-bottom: 3px;
      font-weight: 500;
    }
    .timeline-note { font-size: 13px; color: var(--text); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 100px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 200;
      opacity: 0;
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
    .toast.error { background: var(--red); color: white; }
    .toast.success { background: var(--green); color: white; }

    /* ─── LOADING ─── */
    .loader {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .full-loader {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      z-index: 500;
    }
    .full-loader.hidden { display: none; }
    .full-loader .pulse {
      font-size: 52px;
      animation: pulse 1.6s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(92, 150, 99, 0.35));
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    .full-loader .msg {
      color: var(--text-dim); font-size: 13px; font-weight: 500;

    const CONFIG = {

      SHEETS: {

    };

    // ╔═══════════════════════════════════════╗

    const state = {
      plants: [],

      growthLog: [],
      selectedPlantId: null,

    };

    // ╔═══════════════════════════════════════╗

    // ╚═══════════════════════════════════════╝
    const $ = (id) => document.getElementById(id);
    const today = () => new Date().toISOString().slice(0, 10);
    const fmtDate = (d) => {
      if (!d) return '—';
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric' });
    };
    const daysBetween = (d1, d2) => Math.round((new Date(d2) - new Date(d1)) / 86400000);
    const driveImg = (url) => {
      if (!url) return null;
      // Already full URL
      if (url.startsWith('http')) {
        // extract id from various Drive url formats
        const m = url.match(/[-\w]{25,}/);
        if (m) return `https://drive.google.com/thumbnail?id=${m[0]}&sz=w800`;
        return url;
      }
      return `https://drive.google.com/thumbnail?id=${url}&sz=w800`;
    };
    const showToast = (msg, type = '') => {
      const t = $('toast');

    const escHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // 닫으려면 우상단 ✕ 버튼 또는 취소 버튼 사용

    // Radio pill behavior
    document.querySelectorAll('.radio-group').forEach(group => {

      if (fertBtn) {

    // ╔═══════════════════════════════════════╗
    // ║      GOOGLE SHEETS READ (gviz)         ║
    // ╚═══════════════════════════════════════╝
    function loadSheet(sheetName) {
      return new Promise((resolve, reject) => {
        const cb = '_gviz_cb_' + Math.random().toString(36).slice(2);
        // 강한 캐시 버스팅: 타임스탬프 + 랜덤
        const bust = Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(sheetName)}&_=${bust}`;
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          delete window[cb];
          script.remove();
          reject(new Error(`'${sheetName}' 로드 타임아웃 (15초)`));
        }, 15000);
        window[cb] = (resp) => {
          clearTimeout(timer);
          delete window[cb];
          script.remove();
          try {
            if (!resp || !resp.table) {
              let errMsg = `'${sheetName}' 응답 형식 오류`;
              if (resp && resp.status === 'error' && resp.errors && resp.errors.length) {
                const e0 = resp.errors[0];
                errMsg = `'${sheetName}': ${e0.message || e0.detailed_message || 'gviz error'}`;
                if (e0.reason) errMsg += ` (${e0.reason})`;
              }
              console.error('[plant-keeper] gviz raw response for', sheetName, ':', resp);
              reject(new Error(errMsg));
              return;
            }
            const cols = resp.table.cols.map(c => c.label || c.id);
            const rows = (resp.table.rows || []).map(r => {
              const obj = {};
              r.c.forEach((cell, i) => {
                let v = cell ? cell.v : null;
                if (v && typeof v === 'string' && v.startsWith('Date(')) {
                  const m = v.match(/Date\((\d+),(\d+),(\d+)/);
                  if (m) v = `${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
                }
                if (v instanceof Date) {
                  v = v.toISOString().slice(0, 10);
                }
                obj[cols[i]] = v;
              });
              return obj;
            });
            resolve(rows);
          } catch (e) { reject(new Error(`'${sheetName}' 파싱 오류: ` + e.message)); }
        };
        script.onerror = () => {
          clearTimeout(timer);
          delete window[cb];
          script.remove();
          reject(new Error(`'${sheetName}' 네트워크 오류`));
        };
        script.src = url;
        document.head.appendChild(script);
      });
    }

    // ╔═══════════════════════════════════════╗
    // ║     APPS SCRIPT WRITE                  ║
    // ╚═══════════════════════════════════════╝
    async function callScript(action, payload = {}) {
      if (!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.startsWith('YOUR_')) {
        throw new Error('Apps Script URL이 설정되지 않았습니다');
      }
      const res = await fetch(CONFIG.SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload })
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { throw new Error('서버 응답 오류: ' + text.slice(0, 100)); }
      if (!data.ok) throw new Error(data.error || '알 수 없는 오류');
      return data;
    }

    async function fileToBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    async function uploadPhoto(file) {
      const base64 = await fileToBase64(file);
      const r = await callScript('uploadPhoto', {
        base64,
        mimeType: file.type,
        filename: file.name || `plant_${Date.now()}.jpg`
      });
      return r.fileId;
    }

    // ╔═══════════════════════════════════════╗
    // ║     CALCULATIONS                       ║
    // ╚═══════════════════════════════════════╝
    function calcWaterStatus(plant) {
      const interval = +plant.watering_interval_days || 7;
      const last = plant.last_watered_date;
      if (!last) return { daysLeft: 0, status: 'due', label: '오늘 물주기' };
      const elapsed = daysBetween(last, today());
      const daysLeft = interval - elapsed;
      if (daysLeft < 0) return { daysLeft, status: 'overdue', label: `${Math.abs(daysLeft)}일 늦음` };
      if (daysLeft === 0) return { daysLeft, status: 'due', label: '오늘 물주기' };
      if (daysLeft <= 1) return { daysLeft, status: 'due', label: '내일 물주기' };
      return { daysLeft, status: 'fresh', label: `${daysLeft}일 남음` };
    }
    function calcFertStatus(plant) {
      const interval = +plant.fertilizer_interval_days || 0;
      if (!interval) return null;
      const last = plant.last_fertilized_date;
      if (!last) return { daysLeft: 0, status: 'due' };
      const elapsed = daysBetween(last, today());
      return { daysLeft: interval - elapsed, status: interval - elapsed < 0 ? 'overdue' : 'fresh' };
    }

    // ╔═══════════════════════════════════════╗
    // ║     RENDER                             ║
    // ╚═══════════════════════════════════════╝
    function render() {
      const today_d = new Date();
      $('todayDate').textContent = today_d.toLocaleDateString('ko-KR', {
        month: 'long', day: 'numeric', weekday: 'long'
      });

      // Compute statuses
      const enriched = state.plants
        .filter(p => p.status !== 'dead')
        .map(p => ({ ...p, water: calcWaterStatus(p), fert: calcFertStatus(p) }));

      // Stats
      $('statTotal').textContent = enriched.length;
      $('statWater').textContent = enriched.filter(p => p.water.status === 'due').length;
      $('statOverdue').textContent = enriched.filter(p => p.water.status === 'overdue').length;
      $('plantCount').textContent = enriched.length;

      // Today's tasks: water due/overdue + fertilizer due
      const tasks = [];
      enriched.forEach(p => {
        if (p.water.status === 'due' || p.water.status === 'overdue') {
          tasks.push({ plant: p, type: 'water', urgent: p.water.status === 'overdue', label: p.water.label });
        }
        if (p.fert && (p.fert.status === 'due' || p.fert.status === 'overdue')) {
          tasks.push({ plant: p, type: 'fert', urgent: p.fert.status === 'overdue', label: p.fert.daysLeft < 0 ? `비료 ${Math.abs(p.fert.daysLeft)}일 늦음` : '비료 줄 시간' });
        }
      });
      tasks.sort((a, b) => (b.urgent - a.urgent));

      $('todayCount').textContent = tasks.length;
      const todayList = $('todayList');
      if (tasks.length === 0) {
        todayList.innerHTML = `<div class="empty-state">
          <div class="ico">🌿</div>
          <div class="msg">모든 식물이 만족스러워합니다</div>
        </div>`;
      } else {
        todayList.innerHTML = tasks.map(t => {
          const photoSrc = driveImg(t.plant.photo_url);
          const thumb = photoSrc
            ? `<img class="today-thumb" src="${photoSrc}" alt="" onerror="this.outerHTML='<div class=today-thumb>🌿</div>'" />`
            : `<div class="today-thumb">🌿</div>`;
          const actionLabel = t.type === 'water' ? '💧 물줬어요' : '🌾 비료줬어요';
          return `<div class="today-card ${t.urgent ? 'overdue' : ''}" id="task-${t.plant.id}-${t.type}">
            ${thumb}
            <div class="today-info">
              <div class="today-name">${escHtml(t.plant.nickname || t.plant.name)}</div>
              <div class="today-meta">${escHtml(t.label)}</div>
            </div>
            <button class="today-action" onclick="quickAction('${t.plant.id}','${t.type}')">${actionLabel}</button>
            <button class="today-dismiss" onclick="dismissTask('${t.plant.id}','${t.type}')" title="할 일 지우기">✕</button>
          </div>`;
        }).join('');
      }

      // Plant grid
      const grid = $('plantGrid');
      if (enriched.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <div class="ico">🪴</div>
          <div class="msg">우측 하단 + 버튼으로 첫 식물을 등록하세요</div>
        </div>`;
      } else {
        grid.innerHTML = enriched.map(p => {
          const photoSrc = driveImg(p.photo_url);
          const photo = photoSrc
            ? `<img class="plant-photo" src="${photoSrc}" alt="" onerror="this.outerHTML='<div class=plant-photo-placeholder>🌿</div>'" />`
            : `<div class="plant-photo-placeholder">🌿</div>`;
          const wIcon = p.water.status === 'overdue' ? '🚨' : (p.water.status === 'due' ? '💧' : '✓');
          return `<div class="plant-card" onclick="openPlantDetail('${p.id}')">
            ${photo}
            <div class="plant-badge ${p.water.status}">${wIcon} ${escHtml(p.water.label)}</div>
            <div class="health-dot ${p.health_status === 'caution' ? 'caution' : (p.health_status === 'sick' ? 'sick' : '')}"></div>
            <div class="plant-info">
              <div class="plant-name">${escHtml(p.nickname || p.name)}</div>
              ${p.nickname ? `<div class="plant-nickname">${escHtml(p.name)}</div>` : ''}
            </div>
          </div>`;
        }).join('');
      }
    }

    const AI_WEBHOOK_URL = 'https://komorevee.app.n8n.cloud/webhook/plant-info';
    const LIGHT_MAP = { high: '직사광', medium: '반음지', low: '음지' };

    // 폼 내 소개 카드 렌더링
    function renderDescPreview(desc) {
      if (!desc) return;
      $('pdOrigin').textContent = desc.origin ? '📍 ' + desc.origin : '';
      $('pdOrigin').style.display = desc.origin ? '' : 'none';
      $('pdFeatures').innerHTML = (desc.features || []).map(f => `<span class="desc-tag">${escHtml(f)}</span>`).join('');

      $('plantDescPreview').style.display = '';
    }

    // 상세 모달용 소개 카드 HTML 생성
    function renderDetailDescHtml(descJson) {
      if (!descJson) return '';
      let desc;
      try { desc = typeof descJson === 'string' ? JSON.parse(descJson) : descJson; } catch(e) { return ''; }

      // 식물 소개 카드
      const originHtml = desc.origin ? `<div class="desc-origin">📍 ${escHtml(desc.origin)}</div>` : '';
      const tagsHtml = (desc.features || []).length
        ? `<div class="desc-features">${desc.features.map(f=>`<span class="desc-tag">${escHtml(f)}</span>`).join('')}</div>` : '';
      const textHtml = desc.description ? `<div class="desc-text">${escHtml(desc.description)}</div>` : '';
      const introCard = (originHtml || tagsHtml || textHtml)
        ? `<div class="detail-desc-card">
            <div class="desc-label">🌿 식물 소개</div>
            ${originHtml}${tagsHtml}${textHtml}
          </div>` : '';

      // 케어 가이드 카드
      const c = desc.care_guide;
      let careCard = '';
      if (c) {
        const items = [
          { icon: '💧', label: '물주기', val: c.water },
          { icon: '☀️', label: '광량',   val: c.light },
          { icon: '🌡️', label: '온도',   val: c.temperature },
          { icon: '💦', label: '습도',   val: c.humidity },
        ].filter(i => i.val);
        const tipHtml = c.tip
          ? `<div class="care-tip"><div class="care-tip-label">⚠️ 주의사항</div>${escHtml(c.tip)}</div>` : '';
        if (items.length) {
          careCard = `<div class="care-guide-card">
            <div class="care-guide-title">🪴 관리 방법</div>
            <div class="care-guide-grid">
              ${items.map(i => `<div class="care-item">
                <div class="care-item-label">${i.icon} ${escHtml(i.label)}</div>
                <div class="care-item-val">${escHtml(i.val)}</div>
              </div>`).join('')}
            </div>
            ${tipHtml}
          </div>`;
        }
      }

      return introCard + careCard;
    }

    async function aiFillPlantInfo() {
      const name = $('fName').value.trim();
      if (!name) {
        showToast('먼저 식물 이름을 입력하세요 🌿');
        $('fName').focus();
        return;
      }

      const btn   = $('aiFillBtn');
      const label = $('aiFillLabel');
      btn.disabled = true;
      label.textContent = 'AI가 정보를 불러오는 중...';

      try {
        const res = await fetch(AI_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plantName: name })
        });
        if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
        const data = await res.json();

        // 물주기
        if (data.watering_interval_days) $('fWaterInterval').value = data.watering_interval_days;

        // 비료 — 토글 상태는 건드리지 않고 주기 값만 업데이트
        if (data.fertilizer_interval_days > 0) {
          $('fFertInterval').value = data.fertilizer_interval_days;
        }

        // 광량
        const lightVal = LIGHT_MAP[data.light_level] || '반음지';
        document.querySelectorAll('#lightRadio input').forEach(r => {
          r.checked = (r.value === lightVal);
          r.closest('.radio-pill').classList.toggle('active', r.checked);
        });

        // 식물 소개 (메모 대신 별도 필드에 저장)
        if (data.plant_description) {
          $('fPlantDesc').value = JSON.stringify(data.plant_description);
          renderDescPreview(data.plant_description);
        }

        showToast('✓ AI 자동완성 완료', 'success');
      } catch (e) {
        showToast('AI 정보 로드 실패: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        label.textContent = 'AI로 관리 정보 자동완성';
      }
    }

    // ╔═══════════════════════════════════════╗
    // ║     FORM HANDLERS                      ║
    // ╚═══════════════════════════════════════╝
    $('photoInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const base64 = await fileToBase64(file);
      $('photoPreview').src = `data:${file.type};base64,${base64}`;
      $('photoPreview').style.display = '';
      $('photoPlaceholder').style.display = 'none';
      state.pendingPhoto = { base64, mimeType: file.type, filename: file.name };
    });

    $('gPhotoInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const base64 = await fileToBase64(file);
      $('gPhotoPreview').src = `data:${file.type};base64,${base64}`;
      $('gPhotoPreview').style.display = '';
      $('gPhotoPlaceholder').style.display = 'none';
      state.pendingGrowthPhoto = { base64, mimeType: file.type, filename: file.name };
    });

    $('plantForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = $('plantFormSubmit');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loader"></span>';
      try {
        let photoUrl = $('photoPreview').dataset.existing || '';
        if (state.pendingPhoto) {
          showToast('사진 업로드 중...');
          const r = await callScript('uploadPhoto', state.pendingPhoto);
          photoUrl = r.fileId;
        }
        const fertOn = $('fertToggle').dataset.on === 'true';
        const data = {
          id: $('plantId').value || ('p_' + Date.now()),
          name: $('fName').value.trim(),
          nickname: $('fNickname').value.trim(),
          photo_url: photoUrl,
          purchase_date: $('fPurchaseDate').value,
          vendor: $('fVendor').value.trim(),
          last_repot_date: $('fRepotDate').value,
          watering_interval_days: +$('fWaterInterval').value || 7,
          last_watered_date: $('fLastWatered').value,
          fertilizer_interval_days: fertOn ? (+$('fFertInterval').value || 30) : 0,
          last_fertilized_date: fertOn ? $('fLastFert').value : '',
          light_level: document.querySelector('#lightRadio input:checked').value,
          location: $('fLocation').value.trim(),
          health_status: document.querySelector('#healthRadio input:checked').value,
          notes: $('fNotes').value.trim(),
          plant_description: $('fPlantDesc').value,
          status: 'active'
        };
        const isEdit = !!$('plantId').value;
        await callScript(isEdit ? 'updatePlant' : 'addPlant', { plant: data });

        // local update
        if (isEdit) {
          const idx = state.plants.findIndex(x => x.id === data.id);
          if (idx >= 0) state.plants[idx] = { ...state.plants[idx], ...data };
        } else {
          state.plants.unshift(data);
        }
        closeModal('plantFormModal');
        render();
        showToast(isEdit ? '수정됨 ✓' : '등록 완료 🌱', 'success');
      } catch (err) {
        showToast('실패: ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '저장';
      }
    });

    $('growthForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('growthSubmit');
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>';
      try {
        let photoUrl = '';
        if (state.pendingGrowthPhoto) {
          showToast('사진 업로드 중...');
          const r = await callScript('uploadPhoto', state.pendingGrowthPhoto);
          photoUrl = r.fileId;
        }
        const record = {
          id: 'g_' + Date.now(),
          plant_id: $('gPlantId').value,
          date: $('gDate').value || today(),
          photo_url: photoUrl,
          notes: $('gNotes').value.trim()
        };
        await callScript('addGrowthRecord', { record });
        state.growthLog.unshift(record);
        closeModal('growthFormModal');
        // re-open detail to show new record
        const pid = record.plant_id;
        setTimeout(() => openPlantDetail(pid), 200);
        showToast('기록 완료 📔', 'success');
      } catch (err) {
        showToast('실패: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '기록';
      }
    });

    // ╔═══════════════════════════════════════╗
    // ║     NOTIFICATIONS                      ║
    // ╚═══════════════════════════════════════╝
    async function checkNotifications() {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      const enriched = state.plants
        .filter(p => p.status !== 'dead')
        .map(p => ({ ...p, water: calcWaterStatus(p) }));
      const due = enriched.filter(p => p.water.status === 'due' || p.water.status === 'overdue');
      if (due.length === 0) return;
      // Don't spam: only notify once per day
      const lastNotify = localStorage.getItem('lastNotify');
      if (lastNotify === today()) return;
      const reg = await navigator.serviceWorker.ready;
      const body = due.length === 1
        ? `${due[0].name} 식물에 물을 줄 시간이에요`
        : `${due.length}개 식물이 물을 기다리고 있어요`;
      reg.showNotification('🌱 푸릇', {
        body,
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        tag: 'water-reminder'
      });
      localStorage.setItem('lastNotify', today());
    }

    $('notifyBtn').onclick = async () => {
      if (!('Notification' in window)) {
        showToast('이 브라우저는 알림 미지원');
        return;
      }
      if (Notification.permission === 'granted') {
        showToast('알림 이미 켜져 있어요 🔔');
        await checkNotifications();
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        showToast('알림 켜졌어요!', 'success');
        await checkNotifications();
      } else {
        showToast('알림이 거부되었어요');
      }
    };

    // ╔═══════════════════════════════════════╗
    // ║     PWA INSTALL                        ║
    // ╚═══════════════════════════════════════╝
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      state.installPrompt = e;
      if (!localStorage.getItem('installDismissed')) {
        $('installBanner').classList.add('show');
      }
    });
    $('installBtn').onclick = async () => {
      if (!state.installPrompt) return;
      state.installPrompt.prompt();
      const r = await state.installPrompt.userChoice;
      if (r.outcome === 'accepted') $('installBanner').classList.remove('show');
      state.installPrompt = null;
    };
    $('installClose').onclick = () => {
      $('installBanner').classList.remove('show');
      localStorage.setItem('installDismissed', '1');
    };

    // ╔═══════════════════════════════════════╗
    // ║     INIT                               ║
    // ╚═══════════════════════════════════════╝
    $('fab').onclick = () => openPlantForm(null);
    $('reloadBtn').onclick = () => loadAll();

    async function loadAll() {
      try {
        $('loader').classList.remove('hidden');
        // Promise.allSettled로 각각 독립 처리: 일부 실패해도 나머지는 유지
        const results = await Promise.allSettled([
          loadSheet(CONFIG.SHEETS.plants),
          loadSheet(CONFIG.SHEETS.watering_log),
          loadSheet(CONFIG.SHEETS.growth_log)
        ]);
        const [plantsR, waterR, growthR] = results;

        // 식물 데이터: 성공시에만 갱신, 실패시 기존 데이터 유지
        if (plantsR.status === 'fulfilled') {
          state.plants = plantsR.value;
          console.log('[plant-keeper] plants loaded:', state.plants.length);
        } else {
          console.error('[plant-keeper] plants load failed:', plantsR.reason);
          if (state.plants.length > 0) {
            showToast('일시적으로 시트 연결 실패 (기존 데이터 유지)', 'error');
          } else {
            showToast('데이터 로드 실패: ' + plantsR.reason.message, 'error');
          }
        }

        if (waterR.status === 'fulfilled') state.waterLog = waterR.value;
        else console.error('[plant-keeper] water log load failed:', waterR.reason);

        if (growthR.status === 'fulfilled') state.growthLog = growthR.value;
        else console.error('[plant-keeper] growth log load failed:', growthR.reason);

        render();
        await checkNotifications();
      } catch (e) {
        showToast('데이터 로드 실패: ' + e.message, 'error');
        render();
      } finally {
        $('loader').classList.add('hidden');
      }
    }

    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW reg failed:', err));
      });
    }

    // Config check
    if (CONFIG.SHEET_ID.startsWith('YOUR_') || CONFIG.SCRIPT_URL.startsWith('YOUR_')) {
      $('loader').classList.add('hidden');
      document.body.innerHTML = `
        <div style="padding:40px 24px;text-align:center;color:var(--text)">
          <div style="font-size:48px;margin-bottom:16px">⚙️</div>
          <h2 style="margin-bottom:12px">초기 설정이 필요해요</h2>
          <p style="color:var(--text-dim);font-size:14px;line-height:1.6">
            <code>index.html</code>의 <code>CONFIG</code> 객체에서<br/>
            <code>SHEET_ID</code>와 <code>SCRIPT_URL</code>을<br/>
            본인 것으로 교체하세요.<br/><br/>
            자세한 내용은 <code>setup-guide.md</code> 참고
          </p>
        </div>
      `;
    } else {
      loadAll();
    }
  </script>
</body>
</html>
